name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Test and package
        shell: bash
        run: bash ./mvnw --batch-mode clean package
      - name: Test experiment runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test_run_public_experiment.ps1
      # Synthetic QSim tests require no redistributed Sioux Falls input or API key.

name: Bug report
description: Report a reproducible problem with AgenticMobility.
title: "[Bug]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the actual result and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the command or configuration and a small example, if possible. Remove credentials and private data.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Code commit, operating system, Java version, and model service if relevant.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      description: Include the smallest useful excerpt, without API keys or personal data.
      render: text

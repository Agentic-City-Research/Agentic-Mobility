name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Test and package
        shell: bash
        run: bash ./mvnw --batch-mode clean package
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test baseline candidate ranking
        shell: bash
        run: |
          python -m pip install 'zstandard>=0.23,<1'
          python -m unittest discover -s analysis/tests -p 'test_rank_toll_candidates.py'
      # Synthetic QSim tests require no redistributed Sioux Falls input or API key.
